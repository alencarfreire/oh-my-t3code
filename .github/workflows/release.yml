name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Release macOS Universal
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies and run checks
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: "Oh My T3Code v__VERSION__"
          releaseBody: "Build oficial macOS Universal (Apple Silicon + Intel) gerada via GitHub Actions."
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: --target universal-apple-darwin

      - name: Update Homebrew Cask
        if: success() && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
        run: |
          DMG_FILE="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)"
          if [[ -z "${DMG_FILE}" || ! -f "${DMG_FILE}" ]]; then
            echo "DMG not found, skipping Homebrew Cask update."
            exit 0
          fi

          APP_VERSION="$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json", "utf8")).version)')"
          DMG_SHA256="$(shasum -a 256 "${DMG_FILE}" | awk '{print $1}')"

          git fetch origin main
          git checkout -B main origin/main

          APP_VERSION="${APP_VERSION}" DMG_SHA256="${DMG_SHA256}" bun -e '
            const fs = require("fs");
            const path = "Casks/oh-my-t3code.rb";
            const version = process.env.APP_VERSION;
            const sha256 = process.env.DMG_SHA256;
            let content = fs.readFileSync(path, "utf8");
            content = content.replace(/^(\s*version\s+)"[^"]+"/m, `$1"${version}"`);
            content = content.replace(/^(\s*sha256\s+)"[^"]+"/m, `$1"${sha256}"`);
            fs.writeFileSync(path, content);
          '

          if ! git diff --quiet -- Casks/oh-my-t3code.rb; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/oh-my-t3code.rb
            git commit -m "chore(release): update Homebrew cask for v${APP_VERSION} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload macOS artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-bundle
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn
