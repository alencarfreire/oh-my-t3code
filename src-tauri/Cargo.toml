[package]
name = "oh-my-t3code"
version = "0.1.0"
description = "Native macOS Menu Bar companion, Preset Studio, and deterministic squad compiler for T3 Code"
authors = ["Alencar Freire"]
edition = "2021"

[lib]
name = "oh_my_t3code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
